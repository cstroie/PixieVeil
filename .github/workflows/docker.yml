# Builds the cpu image and publishes it to ghcr.io/<owner>/pixieveil.
# Runs on a version tag (v*) or manually from the Actions tab; never on plain pushes.
name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pixieveil
          flavor: |
            latest=false
          tags: |
            type=raw,value=cpu
            type=semver,pattern={{version}}-cpu
            type=sha,format=short,suffix=-cpu

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VARIANT=cpu
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

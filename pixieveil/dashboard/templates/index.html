<!DOCTYPE html>
<html lang="en">
<head>
    <!--pv:head-->
    <title>Status – PixieVeil</title>
    <style>
        .page { max-width: 1120px; margin: 0 auto; padding: 28px 20px 56px; display: flex; flex-direction: column; gap: 28px; }

        .page-head { display: flex; align-items: baseline; gap: 12px 20px; flex-wrap: wrap; }
        .page-head h1 { font-size: 22px; }
        .page-head .meta { display: flex; gap: 6px 18px; flex-wrap: wrap; color: var(--text-dim); font-size: 13px; }
        .page-head .meta .off { color: var(--text-faint); }
        h2.section { font-size: 14px; font-weight: 650; margin-bottom: 10px; }

        /* ------------------------------------------------ the strip
           One column per pipeline stage, one slice per study. A slice is a
           link to that study, coloured by what it is waiting on. */
        .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .stage { padding: 18px 20px 16px; border-left: 1px solid var(--border); min-width: 0; }
        .stage:first-child { border-left: 0; }
        .stage-name { font-weight: 600; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
        .stage-name .now { font-size: 12px; font-weight: 600; color: var(--busy); }
        .stage-count { font-size: 40px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; margin-top: 2px; }
        .stage-count.zero { color: var(--text-faint); }
        .stage-note { font-size: 12.5px; color: var(--text-faint); min-height: 19px; }
        .stage-note a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
        .stage-note a:hover { color: var(--text); }

        .slices { display: flex; flex-wrap: wrap; gap: 3px; margin: 14px 0 12px; min-height: 30px; align-content: flex-start; }
        .slice {
            width: 9px; height: 30px; border-radius: 1px; flex: none;
            background: var(--border-strong);
        }
        a.slice:hover, a.slice:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
        .slice.ok { background: var(--ok); }
        .slice.warn { background: var(--warn); }
        .slice.bad { background: var(--bad); }
        .slice.busy { background: var(--busy); animation: breathe 1.6s ease-in-out infinite; }
        .slice.done { background: var(--border-strong); }
        .slices .more { align-self: center; margin-left: 4px; font-size: 12px; color: var(--text-faint); }
        .slices .none { align-self: center; font-size: 12.5px; color: var(--text-faint); }
        @keyframes breathe { 50% { opacity: 0.4; } }

        .legend { display: flex; gap: 6px 18px; flex-wrap: wrap; padding: 10px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
        .legend span { display: inline-flex; align-items: center; gap: 6px; }
        .legend i { width: 7px; height: 12px; border-radius: 1px; background: var(--border-strong); }
        .legend .ok { background: var(--ok); } .legend .warn { background: var(--warn); }
        .legend .bad { background: var(--bad); } .legend .busy { background: var(--busy); }

        /* ------------------------------------------------ to do */
        .todo { list-style: none; margin: 0; padding: 0; }
        .todo li { border-top: 1px solid var(--border); }
        .todo li:first-child { border-top: 0; }
        .todo .item { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px 12px 0; color: inherit; }
        .todo a.item:hover { background: var(--raised); color: inherit; }
        .todo .bar { align-self: stretch; background: var(--border-strong); }
        .todo .warn .bar { background: var(--warn); } .todo .bad .bar { background: var(--bad); }
        .todo .ok .bar { background: var(--ok); } .todo .info .bar { background: var(--busy); }
        .todo strong { display: block; font-weight: 600; }
        .todo .why { color: var(--text-dim); font-size: 13px; }
        .todo .go { color: var(--accent); font-weight: 550; white-space: nowrap; }

        /* ------------------------------------------------ figures */
        .figures { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .figure { padding: 14px 18px; border-left: 1px solid var(--border); min-width: 0; }
        .figure:first-child { border-left: 0; }
        .figure .f-label { font-size: 12.5px; color: var(--text-dim); }
        .figure .f-value { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 2px 0; }
        .figure .f-sub { font-size: 12px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .figure.alert .f-value { color: var(--bad); }

        details.drawer > summary {
            list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
            padding: 12px 18px; font-weight: 550; color: var(--text-dim); border-top: 1px solid var(--border);
        }
        details.drawer > summary::-webkit-details-marker { display: none; }
        details.drawer > summary svg { width: 15px; height: 15px; transition: transform 0.15s; }
        details.drawer[open] > summary svg { transform: rotate(90deg); }
        details.drawer > summary:hover { color: var(--text); }
        .details-grid { display: grid; gap: 20px 32px; padding: 6px 18px 18px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
        .details-grid h3 { font-size: 13px; font-weight: 650; margin-bottom: 2px; }
        .details-grid .facts { font-size: 13px; }

        @media (max-width: 860px) {
            .strip { grid-template-columns: 1fr 1fr; }
            .stage:nth-child(3) { border-left: 0; }
            .stage:nth-child(n+3) { border-top: 1px solid var(--border); }
            .figures { grid-template-columns: 1fr 1fr; }
            .figure { border-left: 0; border-top: 1px solid var(--border); }
            .figure:nth-child(-n+2) { border-top: 0; }
            .figure:nth-child(even) { border-left: 1px solid var(--border); }
        }
        @media (max-width: 520px) {
            .page { padding: 20px 16px 40px; }
            .strip { grid-template-columns: 1fr; }
            .stage { border-left: 0; border-top: 1px solid var(--border); }
            .stage:first-child { border-top: 0; }
            .todo .item { grid-template-columns: 4px minmax(0, 1fr); }
            .todo .go { grid-column: 2; }
            .todo .bar { grid-row: 1 / span 2; }
        }
    </style>
</head>
<body>
    <!--pv:topbar-->

    <main class="page">
        <header class="page-head">
            <h1>Status</h1>
            <div class="meta" id="meta"><span class="skeleton" style="width:240px"></span></div>
        </header>

        <section aria-labelledby="h-pipeline">
            <h2 class="section" id="h-pipeline">Studies in the pipeline</h2>
            <div class="card">
                <div class="strip">
                    <div class="stage" id="st-receive">
                        <div class="stage-name">Receiving <span class="now"></span></div>
                        <div class="stage-count num">–</div>
                        <div class="slices"></div>
                        <div class="stage-note">Arriving by C-STORE, anonymized on receipt</div>
                    </div>
                    <div class="stage" id="st-process">
                        <div class="stage-name">Processing <span class="now"></span></div>
                        <div class="stage-count num">–</div>
                        <div class="slices"></div>
                        <div class="stage-note"></div>
                    </div>
                    <div class="stage" id="st-ready">
                        <div class="stage-name">Ready to export <span class="now"></span></div>
                        <div class="stage-count num">–</div>
                        <div class="slices"></div>
                        <div class="stage-note">Nothing is sent until you send it</div>
                    </div>
                    <div class="stage" id="st-exported">
                        <div class="stage-name">Exported <span class="now"></span></div>
                        <div class="stage-count num">–</div>
                        <div class="slices"></div>
                        <div class="stage-note"></div>
                    </div>
                </div>
                <div class="legend" aria-hidden="true">
                    <span><i class="busy"></i>In progress</span>
                    <span><i class="warn"></i>Needs data entry</span>
                    <span><i class="ok"></i>Complete, ready to send</span>
                    <span><i class="bad"></i>Blocked</span>
                    <span><i></i>Exported</span>
                </div>
            </div>
        </section>

        <section aria-labelledby="h-todo">
            <h2 class="section" id="h-todo">Waiting on you</h2>
            <div class="card"><ul class="todo" id="todo" aria-live="polite">
                <li><div class="item"><span class="bar"></span><span class="skeleton" style="width:260px"></span></div></li>
            </ul></div>
        </section>

        <section aria-labelledby="h-figures">
            <h2 class="section" id="h-figures">Since the server started</h2>
            <div class="card">
                <div class="figures" id="figures"></div>
                <details class="drawer" id="drawer">
                    <summary><span data-icon="chevron"></span>All counters</summary>
                    <div class="details-grid" id="details"></div>
                </details>
            </div>
        </section>
    </main>

    <script src="/static/common.js"></script>
    <script>
        'use strict';
        const { esc, fmtInt, icon, pad4 } = PV;
        let tick = 0;
        let live = null;   // PV.live() handle, set below
        let studies = null;
        let lastStats = null;

        document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });

        // Which column a study sits in, and the tone of its slice.
        const IN_PROGRESS = ['complete', 'defacing'];
        const BLOCKED = ['defacing_failed', 'defacing_disabled'];
        function place(s) {
            if (s.status === 'receiving') return ['st-receive', 'busy'];
            if (IN_PROGRESS.includes(s.status)) return ['st-process', 'busy'];
            if (BLOCKED.includes(s.status)) return ['st-process', 'bad'];
            if (s.status === 'archived') return ['st-exported', 'done'];
            return ['st-ready', PV.needsInput(s) ? 'warn' : 'ok'];
        }
        function sliceTitle(s) {
            const label = (PV.STATUS[s.status] || { label: s.status }).label;
            const missing = PV.missingLabels((s.exam_summary || {}).missing_fields);
            const tail = s.status === 'ready' && missing.length ? `, missing ${missing.join(', ')}` : '';
            return `Study ${pad4(s.study_number)}: ${label}${tail}`;
        }

        const MAX_SLICES = 48;
        function renderStage(id, list, { count, active, now, note }) {
            const el = document.getElementById(id);
            const c = el.querySelector('.stage-count');
            c.textContent = fmtInt(count);
            c.classList.toggle('zero', !count);
            el.querySelector('.now').textContent = active ? (now || 'working') : '';
            if (note !== undefined) el.querySelector('.stage-note').innerHTML = note;
            const host = el.querySelector('.slices');
            if (!list) return;               // study list not loaded yet
            // Newest first; an overflowing column keeps the newest ones.
            const shown = list.slice(-MAX_SLICES).reverse();
            host.innerHTML = shown.map(([s, tone]) =>
                `<a class="slice ${tone}" href="/studies#${s.study_number}" title="${esc(sliceTitle(s))}"
                    aria-label="${esc(sliceTitle(s))}"></a>`).join('')
                + (list.length > shown.length
                    ? `<span class="more">+${fmtInt(list.length - shown.length)} earlier</span>` : '')
                || '<span class="none">None</span>';
        }

        // "0006 · Defacing 2/9 · S0003 inference · 4m" for the first study
        // with an in-flight step of one of *kinds*, "+N more" for the rest.
        function nowText(progress, kinds, fallback) {
            const mine = progress.filter(p => kinds.includes(p.kind));
            if (!mine.length) return fallback;
            const more = mine.length > 1 ? ` (+${mine.length - 1} more)` : '';
            return `${pad4(mine[0].n)} · ${PV.progressText(mine[0])}${more}`;
        }

        function renderPipeline(data) {
            const a = data.pipeline.active || {};
            const prog = (data.pipeline.progress || []).map(PV.stampProgress);
            const sc = data.pipeline.status_counts || {};
            const caps = data.capabilities || {};
            const cols = studies ? { 'st-receive': [], 'st-process': [], 'st-ready': [], 'st-exported': [] } : null;
            if (cols) for (const s of studies) { const [col, tone] = place(s); cols[col].push([s, tone]); }
            const col = id => (cols ? cols[id] : null);

            const blocked = (sc.defacing_failed || 0) + (sc.defacing_disabled || 0);
            renderStage('st-receive', col('st-receive'),
                { count: sc.receiving, active: a.receiving,
                  now: nowText(prog, ['receive'], 'receiving images') });
            renderStage('st-process', col('st-process'), {
                count: (sc.complete || 0) + (sc.defacing || 0) + blocked,
                active: a.waiting || a.defacing,
                now: a.defacing ? nowText(prog, ['deface'], 'defacing') : 'extracting',
                note: blocked
                    ? `<a href="/studies?filter=failed">${blocked} blocked on defacing</a>`
                    : (data.defacing_enabled ? 'Exam data extracted, head scans defaced'
                                             : 'Exam data extracted; defacing is off'),
            });
            renderStage('st-ready', col('st-ready'), { count: sc.ready });
            const targets = [caps.dicom && 'DICOM', caps.http && 'HTTP', caps.rhythm && 'RHYTHM'].filter(Boolean);
            renderStage('st-exported', col('st-exported'), {
                count: sc.archived, active: a.exporting,
                now: nowText(prog, ['dicom', 'rhythm', 'zip'], 'sending'),
                note: targets.length ? `Targets: ${esc(targets.join(', '))}` : 'No export target set',
            });

            document.getElementById('meta').innerHTML = [
                `<span>Up ${esc(PV.fmtDuration(data.uptime_s))}</span>`,
                data.defacing_enabled ? '<span>Defacing on</span>' : '<span class="off">Defacing off</span>',
            ].join('');
        }

        function renderFigures(kpis) {
            document.getElementById('figures').innerHTML = kpis.map(k => `
                <div class="figure ${k.alert ? 'alert' : ''}">
                    <div class="f-label">${esc(k.label)}</div>
                    <div class="f-value num">${esc(fmtInt(k.value))}</div>
                    <div class="f-sub" title="${esc(k.sub)}">${esc(k.sub)}</div>
                </div>`).join('');
        }

        function renderDetails(groups) {
            document.getElementById('details').innerHTML = groups.map(g => `
                <div>
                    <h3>${esc(g.title)}</h3>
                    <dl class="facts">${g.rows.map(([label, value]) =>
                        `<dt>${esc(label)}</dt><dd>${esc(fmtInt(value))}</dd>`).join('')}</dl>
                </div>`).join('');
        }

        const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
        function renderTodo(stats) {
            if (!studies) return;            // keep the skeleton until both are in
            const sc = stats.pipeline.status_counts || {};
            const caps = stats.capabilities || {};
            const items = [];
            const needs = studies.filter(PV.needsInput).length;
            const nav = document.getElementById('nav-needs');
            if (nav) { nav.hidden = !needs; nav.textContent = needs; }
            if (sc.defacing_failed) {
                items.push({ tone: 'bad', href: '/studies?filter=failed', go: 'Show them',
                    title: `Defacing failed on ${plural(sc.defacing_failed, 'study', 'studies')}`,
                    why: 'They cannot be exported. Restart the server to retry the series that are still undefaced.' });
            }
            if (sc.defacing_disabled) {
                items.push({ tone: 'bad', href: '/studies?filter=failed', go: 'Show them',
                    title: `${plural(sc.defacing_disabled, 'head study is', 'head studies are')} not defaced`,
                    why: 'Defacing is switched off, so they cannot be exported. Enable it in Settings and restart.' });
            }
            if (needs) {
                items.push({ tone: 'warn', href: '/studies?filter=needs', go: 'Enter data',
                    title: `${plural(needs, 'study needs', 'studies need')} data entry`,
                    why: 'Image quality, weight, indication, contrast or the RHYTHM protocol is still missing.' });
            }
            const sendable = studies.filter(s => s.status === 'ready' && !PV.needsInput(s)).length;
            if (sendable) {
                items.push({ tone: 'ok', href: '/studies?filter=ready', go: 'Review and send',
                    title: `${plural(sendable, 'study is', 'studies are')} complete and ready to send`,
                    why: 'Nothing leaves this server until you send it from Studies.' });
            }
            if (!caps.dicom && !caps.http && !caps.rhythm) {
                items.push({ tone: 'info', href: '/settings', go: 'Open Settings',
                    title: 'No export target is configured',
                    why: 'Add a DICOM node, an HTTP endpoint or RHYTHM before studies can be sent.' });
            }
            if (!items.length) {
                items.push({ tone: 'ok', title: 'Nothing is waiting on you',
                    why: 'New studies show up here when they need data entry or are ready to send.' });
            }
            document.getElementById('todo').innerHTML = items.map(it => {
                const inner = `<span class="bar"></span>
                    <span><strong>${esc(it.title)}</strong><span class="why">${esc(it.why)}</span></span>
                    ${it.href ? `<span class="go">${esc(it.go)}</span>` : ''}`;
                return `<li class="${it.tone}">${it.href
                    ? `<a class="item" href="${it.href}">${inner}</a>`
                    : `<div class="item">${inner}</div>`}</li>`;
            }).join('');
        }

        // withStudies: also refetch the study list. Plain polls only do it
        // every third tick; live study/exam events always do.
        async function refresh(withStudies) {
            try {
                const [stats, list] = await Promise.all([
                    PV.api('/stats'),
                    withStudies || tick % 3 === 0 ? PV.api('/api/studies') : Promise.resolve(null),
                ]);
                tick++;
                if (list) studies = list.studies || [];
                lastStats = stats;
                // With SSE the stream owns the indicator; plain polling only
                // claims "connected" when there's no live stream at all.
                if (!live) PV.setConn(true);
                renderPipeline(stats);
                renderFigures(stats.kpis);
                renderDetails(stats.details);
                renderTodo(stats);
            } catch (err) {
                console.error(err);
                PV.setConn(false);
            }
        }

        const poller = PV.poll(() => refresh(false), 5000);
        // Live updates: any study/counter change triggers one debounced
        // refresh; polling drops to a 60 s safety net while connected.
        let needStudies = false;
        const flush = PV.debounce(() => { const w = needStudies; needStudies = false; refresh(w); }, 400);
        const liveRefresh = withStudies => { needStudies = needStudies || withStudies; flush(); };
        live = PV.live({
            study: () => liveRefresh(true),
            exam: () => liveRefresh(true),
            counters: () => liveRefresh(false),
            progress: () => liveRefresh(false),
            resync: () => liveRefresh(true),
            state: ok => { poller.slow(ok); PV.setConn(ok, ok ? 'Live' : 'Reconnecting…'); if (ok) liveRefresh(true); },
        });

        // Remember whether the counters drawer was left open.
        const drawer = document.getElementById('drawer');
        try { drawer.open = localStorage.getItem('pixieveil_drawer') === '1'; } catch (_e) { /* ignore */ }
        drawer.addEventListener('toggle', () => {
            try { localStorage.setItem('pixieveil_drawer', drawer.open ? '1' : '0'); } catch (_e) { /* ignore */ }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PixieVeil Dashboard</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
        <style>
            /* Compact admin UI — override Pico's root custom properties.
               --pico-font-size is the % applied to <html>, so dropping it
               shrinks every rem-based size (type, form controls, the
               spacing that keys off rem) proportionally. */
            :root {
                --pico-font-size: 87.5%;                  /* 16px -> 14px base */
                --pico-line-height: 1.45;
                --pico-typography-spacing-vertical: 0.75rem;
                --pico-block-spacing-vertical: calc(var(--pico-spacing) * 0.75);
            }
            article {
                margin-bottom: var(--pico-spacing);
            }
            .metrics {
                margin-bottom: calc(var(--pico-spacing) * 1.5);
            }
            .metrics h3 {
                margin-bottom: calc(var(--pico-spacing) * 0.5);
            }
            .metrics article {
                text-align: center;
                padding: var(--pico-spacing) calc(var(--pico-spacing) * 0.75);
                margin-bottom: 0;
                transition: border-color 0.2s;
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
            }
            .metrics article:hover {
                border-color: var(--pico-primary);
            }
            .metrics article > small:first-child {   /* the metric label */
                display: block;
                text-transform: uppercase;
                letter-spacing: 0.03em;
                color: var(--pico-muted-color);
            }
            .metrics article .value-row {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 0.35rem;
            }
            .metrics article data {
                font-size: 1.75rem;
                line-height: 1;
                font-weight: bold;
                color: var(--pico-primary);
                font-variant-numeric: tabular-nums;
            }
            .metrics article .unit {
                color: var(--pico-muted-color);
            }
            .metrics.errors article data,
            .metrics article data.error-value {
                color: var(--pico-form-element-invalid-focus-color);
            }
            .sub-value {
                color: var(--pico-muted-color);
            }
            .defacing-disabled {
                color: var(--pico-muted-color);
                font-style: italic;
            }
            .section-title {
                display: flex;
                align-items: baseline;
                gap: calc(var(--pico-spacing) * 0.75);
                margin-bottom: calc(var(--pico-spacing) * 0.5);
            }
            .section-title h3 {
                margin: 0;
            }
            .badge {
                font-size: 0.8125em;
                font-weight: var(--pico-font-weight);
                text-transform: uppercase;
                letter-spacing: 0.02em;
                padding: 0.15rem 0.55rem;
                border-radius: var(--pico-border-radius);
            }
            .badge-enabled {
                color: var(--pico-form-element-valid-focus-color);
                border: 1px solid var(--pico-form-element-valid-focus-color);
            }
            .badge-disabled {
                color: var(--pico-muted-color);
                border: 1px solid var(--pico-muted-border-color);
            }
            .status-bar {
                display: flex;
                flex-wrap: wrap;
                gap: calc(var(--pico-spacing) * 0.75) calc(var(--pico-spacing) * 1.25);
                align-items: center;
            }
            .led {
                display: inline-flex;
                align-items: center;
                gap: 0.4rem;
            }
            .led-dot {
                display: inline-block;
                width: 0.75rem;
                height: 0.75rem;
                border-radius: 50%;
                background-color: var(--pico-muted-border-color);
                flex-shrink: 0;
                transition: background-color 0.3s, box-shadow 0.3s;
            }
            .led-dot.active {
                background-color: var(--pico-form-element-valid-focus-color);
                box-shadow: 0 0 6px var(--pico-form-element-valid-focus-color);
            }
            .led-dot.active.led-error {
                background-color: var(--pico-form-element-invalid-focus-color);
                box-shadow: 0 0 6px var(--pico-form-element-invalid-focus-color);
            }
            .last-updated {
                color: var(--pico-muted-color);
                margin: 0 0 0 auto;
            }
        </style>
    </head>
    <body class="container">
        <nav>
            <ul>
                <li><strong>PixieVeil</strong></li>
            </ul>
            <ul>
                <li><a href="/" aria-current="page">Dashboard</a></li>
                <li><a href="/studies">Studies</a></li>
            </ul>
        </nav>

        <hgroup>
            <h1>PixieVeil Dashboard</h1>
            <p>Real-time DICOM Anonymization Server</p>
        </hgroup>
        
        <header>
            <h2>System Status</h2>
            <article>
                <div class="status-bar" id="status-bar">
                    <span class="led"><span class="led-dot" id="led-server"></span>Server</span>
                    <span class="led"><span class="led-dot" id="led-receiving"></span>Receiving</span>
                    <span class="led"><span class="led-dot" id="led-waiting"></span>Waiting</span>
                    <span class="led"><span class="led-dot" id="led-defacing"></span>Defacing</span>
                    <span class="led"><span class="led-dot" id="led-exporting"></span>Exporting</span>
                    <small class="last-updated">Last updated: <time id="last-updated">Never</time></small>
                </div>
            </article>
        </header>
        
        <main>
            <div id="metrics-container"><p aria-busy="true">Loading metrics…</p></div>
        </main>

        <footer class="grid">
            <button onclick="refreshData()" role="button">Refresh Data</button>
            <button onclick="toggleAutoRefresh()" id="auto-refresh-btn" role="button" class="secondary">Disable Auto Refresh</button>
        </footer>

        <script>
            let autoRefreshInterval = null;
            let isAutoRefreshEnabled = true;

            async function fetchStats() {
                try {
                    const response = await fetch('/stats');
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    const data = await response.json();
                    updateDashboard(data);
                } catch (error) {
                    console.error('Error fetching stats:', error);
                    const serverDot = document.getElementById('led-server');
                    serverDot.classList.add('active', 'led-error');
                    document.getElementById('metrics-container').innerHTML = '<p>Could not load metrics. Retrying…</p>';
                }
            }

            function formatValue(value) {
                if (typeof value === 'number') {
                    return value.toLocaleString();
                }
                return value;
            }

            function setLed(id, active, extraClass) {
                const dot = document.getElementById(id);
                dot.classList.toggle('active', active);
                if (extraClass) dot.classList.toggle(extraClass, active);
            }

            function updateDashboard(data) {
                const ps = data.pipeline_status || {};
                const serverUp = data.server_status === 'running';

                // Server LED: always lit, green when up, red when stopped
                const serverDot = document.getElementById('led-server');
                serverDot.classList.add('active');
                serverDot.classList.toggle('led-error', !serverUp);

                setLed('led-receiving', !!ps.receiving, null);
                setLed('led-waiting',   !!ps.waiting,   null);
                setLed('led-defacing',  !!ps.defacing,  null);
                setLed('led-exporting', !!ps.exporting, null);

                const now = new Date();
                const lastUpdated = document.getElementById('last-updated');
                lastUpdated.textContent = now.toLocaleTimeString();
                lastUpdated.dateTime = now.toISOString();

                const container = document.getElementById('metrics-container');
                container.innerHTML = '';

                data.sections.forEach(section => {
                    const isDefacing = section.title === 'Defacing';

                    const sectionEl = document.createElement('section');
                    sectionEl.className = 'metrics';
                    if (section.class) {
                        sectionEl.classList.add(section.class);
                    }

                    const titleRow = document.createElement('div');
                    titleRow.className = 'section-title';

                    const title = document.createElement('h3');
                    title.textContent = section.title;
                    titleRow.appendChild(title);

                    if (isDefacing) {
                        const badge = document.createElement('span');
                        badge.className = data.defacing_enabled ? 'badge badge-enabled' : 'badge badge-disabled';
                        badge.textContent = data.defacing_enabled ? 'enabled' : 'disabled';
                        titleRow.appendChild(badge);
                    }

                    sectionEl.appendChild(titleRow);

                    if (isDefacing && !data.defacing_enabled) {
                        const msg = document.createElement('p');
                        msg.className = 'defacing-disabled';
                        msg.textContent = 'Defacing is not enabled in the current configuration.';
                        sectionEl.appendChild(msg);
                        container.appendChild(sectionEl);
                        return;
                    }

                    const grid = document.createElement('div');
                    grid.className = 'grid';

                    section.metrics.forEach(metric => {
                        const article = document.createElement('article');

                        const label = document.createElement('small');
                        label.textContent = metric.label;
                        article.appendChild(label);

                        const valueRow = document.createElement('div');
                        valueRow.className = 'value-row';

                        const valueEl = document.createElement('data');
                        valueEl.value = String(metric.value);
                        valueEl.textContent = formatValue(metric.value);
                        if (isDefacing && metric.label === 'Errors' && metric.value > 0) {
                            valueEl.classList.add('error-value');
                        }
                        valueRow.appendChild(valueEl);

                        if (metric.suffix) {
                            const unit = document.createElement('small');
                            unit.className = 'unit';
                            unit.textContent = metric.suffix;
                            valueRow.appendChild(unit);
                        }

                        article.appendChild(valueRow);

                        if (metric.sub_value !== undefined) {
                            const subLine = document.createElement('small');
                            subLine.className = 'sub-value';
                            let subText = formatValue(metric.sub_value);
                            if (metric.sub_suffix) subText += ' ' + metric.sub_suffix;
                            subLine.textContent = subText;
                            article.appendChild(subLine);
                        }

                        grid.appendChild(article);
                    });

                    sectionEl.appendChild(grid);
                    container.appendChild(sectionEl);
                });
            }

            function refreshData() {
                fetchStats();
            }

            function toggleAutoRefresh() {
                const btn = document.getElementById('auto-refresh-btn');
                if (isAutoRefreshEnabled) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                    isAutoRefreshEnabled = false;
                    btn.textContent = 'Enable Auto Refresh';
                    btn.classList.remove('secondary');
                } else {
                    autoRefreshInterval = setInterval(fetchStats, 5000);
                    isAutoRefreshEnabled = true;
                    btn.textContent = 'Disable Auto Refresh';
                    btn.classList.add('secondary');
                }
            }

            document.addEventListener('DOMContentLoaded', function() {
                fetchStats();
                autoRefreshInterval = setInterval(fetchStats, 5000);
            });
        </script>
    </body>
</html>

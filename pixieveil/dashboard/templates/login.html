<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixieVeil · Sign in</title>
    <script>
        try { document.documentElement.dataset.theme = localStorage.getItem('pixieveil_theme') || 'dark'; }
        catch (_e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%23151b22' stroke='%233cc8c0' stroke-width='2'/%3E%3Cg fill='%233cc8c0'%3E%3Crect x='8' y='8' width='4' height='4' rx='1'/%3E%3Crect x='14' y='8' width='4' height='4' rx='1' opacity='.6'/%3E%3Crect x='8' y='14' width='4' height='4' rx='1' opacity='.6'/%3E%3Crect x='20' y='8' width='4' height='4' rx='1' opacity='.3'/%3E%3Crect x='14' y='14' width='4' height='4' rx='1' opacity='.3'/%3E%3Crect x='8' y='20' width='4' height='4' rx='1' opacity='.3'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        .login-wrap { min-height: calc(100vh - var(--header-h)); display: grid; place-items: center; padding: 24px 16px; }
        .login { width: 100%; max-width: 360px; }
        .login form { display: flex; flex-direction: column; gap: 14px; }
        .login h1 { font-size: 18px; margin-bottom: 2px; }
        .login .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }
        .login .btn { justify-content: center; }
        .login .err { color: var(--bad); background: var(--bad-soft); border-radius: var(--radius-sm);
                      padding: 8px 10px; font-size: 13px; }
        .login .err[hidden] { display: none; }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><g fill="var(--accent)"><rect x="8" y="8" width="4" height="4" rx="1"/><rect x="14" y="8" width="4" height="4" rx="1" opacity=".6"/><rect x="8" y="14" width="4" height="4" rx="1" opacity=".6"/><rect x="20" y="8" width="4" height="4" rx="1" opacity=".3"/><rect x="14" y="14" width="4" height="4" rx="1" opacity=".3"/><rect x="8" y="20" width="4" height="4" rx="1" opacity=".3"/></g><path d="M8 25.5C14 24 21 18 25 8" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
            <span>PixieVeil <small>DICOM anonymizer</small></span>
        </a>
        <div class="spacer"></div>
        <button type="button" class="btn btn-ghost btn-icon" data-theme-toggle></button>
    </header>
    <main class="login-wrap">
        <section class="card login">
            <div class="card-body">
                <form id="login-form" novalidate>
                    <div>
                        <h1>Sign in</h1>
                        <p class="sub">Accounts are created by an administrator.</p>
                    </div>
                    <p class="err" id="err" role="alert" hidden></p>
                    <label class="field"><span class="label">Username</span>
                        <input class="input" name="username" autocomplete="username" autocapitalize="none"
                               spellcheck="false" required autofocus></label>
                    <label class="field"><span class="label">Password</span>
                        <input class="input" type="password" name="password" autocomplete="current-password" required></label>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </form>
            </div>
        </section>
    </main>
    <script src="/static/common.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const err = document.getElementById('err');
        const next = new URLSearchParams(location.search).get('next') || '/';
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const btn = form.querySelector('button[type=submit]');
            btn.disabled = true;
            err.hidden = true;
            const fd = new FormData(form);
            try {
                const r = await PV.api('/login', { method: 'POST', noRedirect: true,
                    body: { username: fd.get('username'), password: fd.get('password'), next } });
                location.replace(r.next || '/');
            } catch (ex) {
                err.textContent = ex.message;
                err.hidden = false;
                form.password.value = '';
                form.password.focus();
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <!--pv:head-->
    <title>Sign in – PixieVeil</title>
    <style>
        .login-wrap { min-height: calc(100vh - var(--header-h)); display: grid; place-items: center; padding: 24px 16px; }
        .login { width: 100%; max-width: 360px; }
        .login form { display: flex; flex-direction: column; gap: 14px; }
        .login h1 { font-size: 18px; margin-bottom: 2px; }
        .login .sub { color: var(--text-dim); font-size: 13px; margin-bottom: 4px; }
        .login .btn { justify-content: center; }
        .login .err { color: var(--bad); background: var(--bad-soft); border-radius: var(--radius-sm);
                      padding: 8px 10px; font-size: 13px; }
        .login .err[hidden] { display: none; }
    </style>
</head>
<body>
    <!--pv:topbar-->
    <main class="login-wrap">
        <section class="card login">
            <div class="card-body">
                <form id="login-form" novalidate>
                    <div>
                        <h1>Sign in</h1>
                        <p class="sub">Accounts are created by an administrator.</p>
                    </div>
                    <p class="err" id="err" role="alert" hidden></p>
                    <label class="field"><span class="label">Username</span>
                        <input class="input" name="username" autocomplete="username" autocapitalize="none"
                               spellcheck="false" required autofocus></label>
                    <label class="field"><span class="label">Password</span>
                        <input class="input" type="password" name="password" autocomplete="current-password" required></label>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </form>
            </div>
        </section>
    </main>
    <script src="/static/common.js"></script>
    <script>
        const form = document.getElementById('login-form');
        const err = document.getElementById('err');
        const next = new URLSearchParams(location.search).get('next') || '/';
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const btn = form.querySelector('button[type=submit]');
            btn.disabled = true;
            err.hidden = true;
            const fd = new FormData(form);
            try {
                const r = await PV.api('/login', { method: 'POST', noRedirect: true,
                    body: { username: fd.get('username'), password: fd.get('password'), next } });
                location.replace(r.next || '/');
            } catch (ex) {
                err.textContent = ex.message;
                err.hidden = false;
                form.password.value = '';
                form.password.focus();
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

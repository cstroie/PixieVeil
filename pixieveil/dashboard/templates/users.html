<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixieVeil · Users</title>
    <script>
        try { document.documentElement.dataset.theme = localStorage.getItem('pixieveil_theme') || 'dark'; }
        catch (_e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%23151b22' stroke='%233cc8c0' stroke-width='2'/%3E%3Cg fill='%233cc8c0'%3E%3Crect x='8' y='8' width='4' height='4' rx='1'/%3E%3Crect x='14' y='8' width='4' height='4' rx='1' opacity='.6'/%3E%3Crect x='8' y='14' width='4' height='4' rx='1' opacity='.6'/%3E%3Crect x='20' y='8' width='4' height='4' rx='1' opacity='.3'/%3E%3Crect x='14' y='14' width='4' height='4' rx='1' opacity='.3'/%3E%3Crect x='8' y='20' width='4' height='4' rx='1' opacity='.3'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/theme.css">
    <style>
        .page { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
        .page h1 { font-size: 22px; }
        .page .lead { color: var(--text-dim); margin: 6px 0 0; }
        .table-wrap { overflow-x: auto; }
        .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
        .add-form { display: grid; gap: 12px; grid-template-columns: 1fr 1fr auto auto; align-items: end; }
        .add-form .check { display: flex; gap: 6px; align-items: center; color: var(--text-dim); font-size: 13px; padding-bottom: 8px; }
        @media (max-width: 700px) { .add-form { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/">
            <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><g fill="var(--accent)"><rect x="8" y="8" width="4" height="4" rx="1"/><rect x="14" y="8" width="4" height="4" rx="1" opacity=".6"/><rect x="8" y="14" width="4" height="4" rx="1" opacity=".6"/><rect x="20" y="8" width="4" height="4" rx="1" opacity=".3"/><rect x="14" y="14" width="4" height="4" rx="1" opacity=".3"/><rect x="8" y="20" width="4" height="4" rx="1" opacity=".3"/></g><path d="M8 25.5C14 24 21 18 25 8" stroke="var(--accent)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
            <span>PixieVeil <small>DICOM anonymizer</small></span>
        </a>
        <nav class="nav">
            <a href="/">Status</a>
            <a href="/studies">Studies</a>
            <a href="/about">About</a>
        </nav>
        <div class="spacer"></div>
        <button type="button" class="btn btn-ghost btn-icon" data-theme-toggle></button>
    </header>

    <main class="page">
        <section>
            <h1>Users</h1>
            <p class="lead">Dashboard accounts. There is no self-registration — add people here or with
                <span class="mono">python -m pixieveil.auth add &lt;name&gt;</span> on the server.</p>
        </section>

        <section class="card">
            <div class="card-head"><h3>Add user</h3></div>
            <div class="card-body">
                <form class="add-form" id="add-form" autocomplete="off">
                    <label class="field"><span class="label">Username</span>
                        <input class="input" name="username" required pattern="[a-z0-9][a-z0-9._\-]{1,31}"
                               autocapitalize="none" spellcheck="false" placeholder="lowercase, 2–32 chars"></label>
                    <label class="field"><span class="label">Initial password</span>
                        <input class="input" type="password" name="password" minlength="8" required autocomplete="new-password"></label>
                    <label class="check"><input type="checkbox" name="admin"> Admin</label>
                    <button type="submit" class="btn btn-primary">Add user</button>
                </form>
            </div>
        </section>

        <section class="card">
            <div class="card-head"><h3>Accounts</h3></div>
            <div class="table-wrap">
                <table class="data">
                    <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last login</th><th>API tokens</th><th></th></tr></thead>
                    <tbody id="rows"><tr><td colspan="6" class="dim">Loading…</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/static/common.js"></script>
    <script>
        const { esc, api, toast, modal, fmtDate } = PV;
        const rows = document.getElementById('rows');

        async function load() {
            let users, self;
            try {
                [users, self] = await Promise.all([
                    api('/api/users').then(r => r.users),
                    api('/api/me').then(r => r.username)]);
            }
            catch (e) { rows.innerHTML = `<tr><td colspan="6" class="dim">${esc(e.message)}</td></tr>`; return; }
            rows.innerHTML = users.map(u => {
                const isSelf = u.username === self;
                return `<tr data-user="${esc(u.username)}">
                    <td><strong>${esc(u.username)}</strong>${isSelf ? ' <span class="faint">(you)</span>' : ''}</td>
                    <td>${u.admin ? '<span class="pill ok">admin</span>' : '<span class="dim">user</span>'}</td>
                    <td>${u.disabled ? '<span class="pill bad">disabled</span>' : '<span class="pill done">active</span>'}</td>
                    <td class="dim">${fmtDate(u.last_login)}</td>
                    <td class="dim">${u.tokens.length}</td>
                    <td><div class="row-actions">
                        <button class="btn btn-ghost" data-act="password">Reset password</button>
                        <button class="btn btn-ghost" data-act="logout" title="End all browser sessions">Log out</button>
                        ${isSelf ? '' : `
                        <button class="btn btn-ghost" data-act="admin">${u.admin ? 'Revoke admin' : 'Make admin'}</button>
                        <button class="btn btn-ghost" data-act="toggle">${u.disabled ? 'Enable' : 'Disable'}</button>
                        <button class="btn btn-ghost" data-act="delete">Delete</button>`}
                    </div></td></tr>`;
            }).join('') || '<tr><td colspan="6" class="dim">No users.</td></tr>';
            rows._users = Object.fromEntries(users.map(u => [u.username, u]));
        }

        rows.addEventListener('click', async e => {
            const btn = e.target.closest('[data-act]');
            if (!btn) return;
            const name = btn.closest('tr').dataset.user;
            const u = rows._users[name];
            const path = `/api/users/${encodeURIComponent(name)}`;
            try {
                switch (btn.dataset.act) {
                case 'password': {
                    const fd = await modal({ title: `Reset password for ${name}`,
                        body: `<p class="dim">Their existing sessions will be logged out.</p>
                               <label class="field"><span class="label">New password (min. 8)</span>
                               <input class="input" type="password" name="password" minlength="8" required autocomplete="new-password"></label>`,
                        confirm: 'Set password' });
                    if (!fd) return;
                    await api(`${path}/password`, { method: 'POST', body: { password: fd.get('password') } });
                    toast(`Password updated for ${name}`, 'ok');
                    break;
                }
                case 'logout':
                    await api(`${path}/logout`, { method: 'POST' });
                    toast(`Ended all sessions for ${name}`, 'ok');
                    break;
                case 'admin':
                    await api(path, { method: 'PATCH', body: { admin: !u.admin } });
                    break;
                case 'toggle':
                    await api(path, { method: 'PATCH', body: { disabled: !u.disabled } });
                    break;
                case 'delete': {
                    const ok = await modal({ title: `Delete ${name}?`, tone: 'danger', confirm: 'Delete',
                        body: '<p>The account and its API tokens are removed. Audit entries keep the name.</p>' });
                    if (!ok) return;
                    await api(path, { method: 'DELETE' });
                    toast(`Deleted ${name}`, 'ok');
                    break;
                }
                }
            } catch (ex) { toast(ex.message, 'bad'); }
            load();
        });

        document.getElementById('add-form').addEventListener('submit', async e => {
            e.preventDefault();
            const f = e.target;
            try {
                await api('/api/users', { method: 'POST', body: {
                    username: f.username.value.trim().toLowerCase(),
                    password: f.password.value, admin: f.admin.checked } });
                toast(`Added ${f.username.value}`, 'ok');
                f.reset();
                load();
            } catch (ex) { toast(ex.message, 'bad'); }
        });

        load();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PixieVeil Studies</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
        <style>
            /* Compact admin UI — override Pico's root custom properties.
               --pico-font-size is the % applied to <html>, so dropping it
               shrinks every rem-based size (type, form controls, the
               spacing that keys off rem) proportionally. */
            :root {
                --pico-font-size: 87.5%;                  /* 16px -> 14px base */
                --pico-line-height: 1.45;
                --pico-typography-spacing-vertical: 0.75rem;
                --pico-block-spacing-vertical: calc(var(--pico-spacing) * 0.75);
                --pico-form-element-spacing-vertical: 0.5rem;
            }
            /* Tables live in a <figure> that scrolls horizontally when the
               columns don't fit; rows in the list are click-to-expand. */
            figure {
                overflow-x: auto;
                margin-bottom: var(--pico-spacing);
            }
            figure > table {
                margin-bottom: 0;
            }
            tr.study-row {
                cursor: pointer;
            }
            tr.study-row:hover > * {
                background-color: var(--pico-table-row-stripe-background-color);
            }
            tr.study-row.selected > * {
                background-color: var(--pico-table-row-stripe-background-color);
            }
            tr.study-row.selected > :first-child {
                box-shadow: inset 0.2rem 0 0 var(--pico-primary);
            }
            /* Status pill — Pico has no badge primitive, so a minimal one
               built from its border/color tokens. */
            .badge {
                display: inline-block;
                font-size: 0.8125em;
                font-weight: var(--pico-font-weight);
                text-transform: uppercase;
                letter-spacing: 0.02em;
                padding: 0.15rem 0.5rem;
                border-radius: var(--pico-border-radius);
                border: 1px solid currentColor;
                white-space: nowrap;
            }
            .badge-ok    { color: var(--pico-form-element-valid-focus-color); }
            .badge-warn  { color: var(--pico-del-color); }
            .badge-muted { color: var(--pico-muted-color); }
            .edited-flag {
                color: var(--pico-primary);
                font-weight: bold;
            }
            /* stack a couple of pills / lines tightly inside a table cell */
            .stack {
                display: flex;
                flex-direction: column;
                gap: 0.2rem;
                align-items: flex-start;
            }
            .nowrap { white-space: nowrap; }
            /* the detail editor sits below the whole table, not in a row —
               a <td> in the shared column layout made the table width
               unpredictable across browsers. */
            #detail-panel-container {
                margin-top: var(--pico-spacing);
            }
            .manual-set {
                border-color: var(--pico-primary);
            }
            /* a button + its inline status text */
            .action-row {
                display: flex;
                gap: calc(var(--pico-spacing) * 0.75);
                flex-wrap: wrap;
                align-items: center;
            }
            /* article <footer> holding the small status / manifest lines */
            article > footer > small {
                display: block;
            }
            .token-bar input {
                max-width: 20rem;
            }
        </style>
    </head>
    <body class="container">
        <nav aria-label="Primary">
            <ul>
                <li><strong>PixieVeil</strong></li>
            </ul>
            <ul>
                <li><a href="/">Dashboard</a></li>
                <li><a href="/studies" aria-current="page">Studies</a></li>
            </ul>
        </nav>

        <hgroup>
            <h1>PixieVeil Studies</h1>
            <p>Extracted exam data, manual review and per-study actions</p>
        </hgroup>

        <fieldset role="group" id="token-bar" hidden>
            <input type="password" id="auth-token" placeholder="Auth token"
                aria-label="Auth token">
            <button type="button" class="secondary" onclick="saveToken()">Save</button>
        </fieldset>

        <main>
            <div id="summary-bar"></div>
            <div id="studies-container" aria-busy="true">Loading studies…</div>
        </main>

        <footer>
            <button class="secondary outline" onclick="refreshStudies()">Refresh</button>
        </footer>

        <script>
            const AUTH_KEY = 'pixieveil_auth_token';
            let CAPABILITIES = { dicom: false, http: false, rhythm: false };
            let AUTH_REQUIRED = false;
            let STUDIES = [];
            let EXPANDED = null;
            let LAST_BULK_MESSAGE = '';

            const REGION_INDICATION_OPTIONS = [
                { region: "Head", indication: "Trauma", contrast: "Non-contrast" },
                { region: "Mastoid bone/Inner Ear",
                  indication: "Hearing loss; congenital malformations, infection, cholesteatoma, cochlear implants",
                  contrast: "Non-contrast" },
                { region: "Chest", indication: "Fungal infections", contrast: "Non-contrast" },
                { region: "Chest", indication: "Complicated infections", contrast: "Contrast-enhanced" },
                { region: "Chest/HRCT (Inspiration/Expiration)",
                  indication: "Interstitial lung diseases, small airways disease, cystic fibrosis, asthma, primary ciliary dyskinesia, chronic lung disease of prematurity",
                  contrast: "Non-contrast" },
                { region: "Chest-Abdomen",
                  indication: "Tumor staging & follow-up (Wilms tumor, neuroblastoma, other)",
                  contrast: "Contrast-enhanced" },
                { region: "Abdomen", indication: "Acute abdomen", contrast: "Contrast-enhanced" },
                { region: "Neck-Chest-Abdomen", indication: "Lymphoma", contrast: "Contrast-enhanced" },
            ];
            // RHYTHM's CTExamination.IMAGE_QUALITY_CHOICES — sent verbatim as
            // the manifest item's image_quality; anything outside this set is
            // silently coerced to "Moderate" server-side (tasks._normalize_image_quality).
            const IMAGE_QUALITY_OPTIONS = ["Excellent", "Good", "Moderate", "Poor"];

            function authToken() {
                return localStorage.getItem(AUTH_KEY) || '';
            }

            function saveToken() {
                const val = document.getElementById('auth-token').value;
                localStorage.setItem(AUTH_KEY, val);
            }

            function authHeaders(extra) {
                const headers = Object.assign({}, extra || {});
                const token = authToken();
                if (token) headers['X-Auth-Token'] = token;
                return headers;
            }

            async function loadStudies() {
                const container = document.getElementById('studies-container');
                try {
                    const resp = await fetch('/api/studies');
                    if (!resp.ok) throw new Error('failed to load studies');
                    const data = await resp.json();
                    STUDIES = data.studies || [];
                    CAPABILITIES = data.capabilities || { dicom: false, http: false, rhythm: false };
                    AUTH_REQUIRED = !!data.auth_required;
                    document.getElementById('token-bar').hidden = !AUTH_REQUIRED;
                    if (AUTH_REQUIRED) {
                        document.getElementById('auth-token').value = authToken();
                    }
                    renderSummaryBar();
                    renderTable();
                } catch (err) {
                    console.error(err);
                    container.removeAttribute('aria-busy');
                    container.innerHTML = '<p>Could not load studies.</p>';
                }
            }

            function locationBadge(loc) {
                // 'base' = files on disk; 'absent' = purged after its
                // retention window (record kept, pixel data gone). 'base' is
                // the normal state — only surface the exception.
                if (loc === 'base') return '';
                const cls = loc === 'absent' ? 'badge-muted' : 'badge-warn';
                const label = loc === 'absent' ? 'purged' : loc;
                return `<span class="badge ${cls}">${label}</span>`;
            }

            function statusBadge(status) {
                const cls = status === 'archived' ? 'badge-ok' :
                    (status === 'ready' ? 'badge-warn' : 'badge-muted');
                return `<span class="badge ${cls}">${status}</span>`;
            }

            function rhythmBadge(st) {
                if (!st) return '—';
                const cls = st === 'COMPLETE' ? 'badge-ok'
                    : (st === 'PARTIAL' || st === 'FAILED' || st === 'failed') ? 'badge-warn'
                    : 'badge-muted';  // "uploaded" — queued, awaiting ingest
                return `<span class="badge ${cls}" title="RHYTHM ingest job state">${esc(st)}</span>`;
            }

            const nStudies = n => `${n} ${n === 1 ? 'study' : 'studies'}`;

            function renderSummaryBar() {
                const bar = document.getElementById('summary-bar');
                const pending = STUDIES.filter(s => s.status === 'ready');
                if (!pending.length) {
                    // Show the last bulk-action result once, even though
                    // there's no longer a pending count to attach it to.
                    bar.innerHTML = LAST_BULK_MESSAGE ? `<p><small>${esc(LAST_BULK_MESSAGE)}</small></p>` : '';
                    LAST_BULK_MESSAGE = '';
                    return;
                }
                const dicomBtn = CAPABILITIES.dicom
                    ? `<button type="button" id="bulk-dicom-btn">Send all to DICOM</button>` : '';
                const httpBtn = CAPABILITIES.http
                    ? `<button type="button" id="bulk-http-btn" class="secondary">Upload all to HTTP</button>` : '';
                const rhythmOk = CAPABILITIES.rhythm && CAPABILITIES.anonymization_profile === 'rhythm';
                const rhythmBtn = CAPABILITIES.rhythm
                    ? `<button type="button" id="bulk-rhythm-btn" class="secondary" ${rhythmOk ? '' : 'disabled'} title="${rhythmOk ? '' : "requires the 'rhythm' anonymization profile"}">Upload all to RHYTHM</button>` : '';
                const pendingNums = pending.map(s => s.study_number).join(',');
                const rhythmManifestLinks = CAPABILITIES.rhythm
                    ? `<small>batch manifest: ` +
                      `<a href="/api/studies/rhythm-manifest?studies=${pendingNums}" target="_blank" rel="noopener">preview</a> · ` +
                      `<a href="/api/studies/rhythm-manifest?studies=${pendingNums}&download=1">download</a></small>` : '';
                const btns = `${dicomBtn}${httpBtn}${rhythmBtn}`;
                bar.innerHTML = `
                    <article>
                        <header>
                            <strong>Ready to export</strong>
                            <span class="badge badge-warn">${nStudies(pending.length)}</span>
                        </header>
                        ${btns ? `<div role="group">${btns}</div>` : ''}
                        <footer>
                            <small id="bulk-status"></small>
                            ${rhythmManifestLinks}
                        </footer>
                    </article>
                `;
                const db = document.getElementById('bulk-dicom-btn');
                const hb = document.getElementById('bulk-http-btn');
                const rb = document.getElementById('bulk-rhythm-btn');
                if (db) db.addEventListener('click', () => runBulkAction('send_dicom'));
                if (hb) hb.addEventListener('click', () => runBulkAction('upload_http'));
                if (rb && !rb.disabled) rb.addEventListener('click', runRhythmBulk);
            }

            async function runRhythmBulk() {
                const pending = STUDIES.filter(s => s.status === 'ready');
                if (!pending.length) return;
                if (!confirm(`Upload ${nStudies(pending.length)} to RHYTHM as one batch?`)) return;
                const statusEl = document.getElementById('bulk-status');
                if (statusEl) statusEl.textContent = `Uploading ${nStudies(pending.length)}…`;

                let batch = '', queued = 0, blocked = 0;
                try {
                    const resp = await fetch('/api/studies/rhythm-batch', {
                        method: 'POST',
                        headers: authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ study_numbers: pending.map(s => s.study_number) }),
                    });
                    const data = await resp.json();
                    batch = data.batch || '';
                    for (const r of Object.values(data.results || {})) {
                        if (r.ok) queued++; else blocked++;
                    }
                } catch (err) {
                    console.error(err);
                    LAST_BULK_MESSAGE = 'RHYTHM batch request failed.';
                    await loadStudies();
                    return;
                }
                LAST_BULK_MESSAGE = blocked
                    ? `RHYTHM batch ${batch}: queued ${queued}, ${blocked} blocked — open each for the reason.`
                    : `RHYTHM batch ${batch}: queued ${nStudies(queued)} for ingest.`;
                await loadStudies();
                if (EXPANDED != null) await loadDetail(EXPANDED);
            }

            async function runBulkAction(action) {
                const pending = STUDIES.filter(s => s.status === 'ready');
                if (!pending.length) return;
                const label = action === 'send_dicom' ? 'the DICOM node' : 'HTTP storage';
                if (!confirm(`Send ${nStudies(pending.length)} to ${label}?`)) return;

                let sent = 0, failed = 0;
                for (const s of pending) {
                    const statusEl = document.getElementById('bulk-status');
                    if (statusEl) statusEl.textContent = `Sending ${sent + failed + 1}/${pending.length}…`;
                    try {
                        const resp = await fetch(`/api/studies/${s.study_number}/actions/${action}`, {
                            method: 'POST',
                            headers: authHeaders({ 'Content-Type': 'application/json' }),
                        });
                        const data = await resp.json();
                        if (data.ok) sent++; else failed++;
                    } catch (err) {
                        console.error(err);
                        failed++;
                    }
                }

                LAST_BULK_MESSAGE = failed
                    ? `Sent ${sent}, failed ${failed}.`
                    : `Sent ${nStudies(sent)}.`;
                await loadStudies();
                if (EXPANDED != null) await loadDetail(EXPANDED);
            }

            function esc(s) {
                if (s === null || s === undefined) return '';
                const div = document.createElement('div');
                div.textContent = String(s);
                // Also escape quotes: this is used inside HTML attribute
                // values (e.g. value="${esc(...)}"), not just text content.
                return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            }

            function renderTable() {
                const container = document.getElementById('studies-container');
                container.removeAttribute('aria-busy');
                if (!STUDIES.length) {
                    container.innerHTML = '<p>No studies found.</p>';
                    return;
                }
                let html = '<figure><table><thead><tr>' +
                    '<th scope="col">#</th><th scope="col">Status</th>' +
                    '<th scope="col">Indication</th><th scope="col">Protocol</th>' +
                    '<th scope="col">Scanner</th><th scope="col">Total DLP</th>' +
                    '<th scope="col">RHYTHM</th>' +
                    '</tr></thead><tbody>';
                STUDIES.forEach(s => {
                    const ex = s.exam_summary;
                    // A corrupt exam sidecar must not look identical to "not
                    // yet extracted" (both would otherwise just show "—").
                    const ind = s.exam_corrupt
                        ? '<span class="badge badge-warn" title="exam sidecar could not be read">⚠ corrupt exam data</span>'
                        : (ex && ex.indication ? `${esc(ex.indication.region || '—')} / ${esc(ex.indication.clinical_indication || '—')}` : '—');
                    const scanner = ex && ex.scanner ? `${esc(ex.scanner.manufacturer || '')} ${esc(ex.scanner.model || '')}`.trim() || '—' : '—';
                    const dlp = ex && ex.total_dlp_mgy_cm != null ? ex.total_dlp_mgy_cm.toFixed(1) + ' mGy·cm' : '—';
                    const edited = ex && ex.has_manual_edits ? ' <span class="edited-flag" title="has manual edits">&#9998;</span>' : '';
                    const ptype = esc(ex ? ex.protocol_type : null) || '—';
                    const pgroup = esc(ex ? ex.examination_group : null);
                    const protoCell = pgroup ? `${ptype}<br><small>${pgroup}</small>` : ptype;
                    const locBadge = locationBadge(s.location);
                    const rowClass = 'study-row' + (EXPANDED === s.study_number ? ' selected' : '');
                    html += `<tr class="${rowClass}" data-n="${s.study_number}">` +
                        `<th scope="row" class="nowrap">${String(s.study_number).padStart(4, '0')}${edited}</th>` +
                        `<td><span class="stack">${statusBadge(s.status)}${locBadge}</span></td>` +
                        `<td>${ind}</td>` +
                        `<td>${protoCell}</td>` +
                        `<td>${scanner}</td>` +
                        `<td class="nowrap">${dlp}</td>` +
                        `<td>${rhythmBadge(s.rhythm_status)}</td>` +
                        `</tr>`;
                });
                html += '</tbody></table></figure>';
                container.innerHTML = html;

                container.querySelectorAll('tr.study-row').forEach(row => {
                    row.addEventListener('click', () => toggleDetail(parseInt(row.dataset.n, 10)));
                });

                // The edit panel is a single block below the table, not a
                // per-row table cell — see the #detail-panel-container CSS note.
                let panel = document.getElementById('detail-panel-container');
                if (!panel) {
                    panel = document.createElement('div');
                    panel.id = 'detail-panel-container';
                    container.appendChild(panel);
                }
                if (EXPANDED != null && !STUDIES.some(s => s.study_number === EXPANDED)) {
                    EXPANDED = null;
                }
            }

            function updateSelectedRow() {
                document.querySelectorAll('tr.study-row').forEach(r => {
                    r.classList.toggle('selected', parseInt(r.dataset.n, 10) === EXPANDED);
                });
            }

            async function toggleDetail(n) {
                const panel = document.getElementById('detail-panel-container');
                if (!panel) return;
                if (EXPANDED === n) {
                    EXPANDED = null;
                    panel.innerHTML = '';
                    updateSelectedRow();
                    return;
                }
                EXPANDED = n;
                updateSelectedRow();
                await loadDetail(n);
            }

            async function loadDetail(n) {
                const el = document.getElementById('detail-panel-container');
                el.innerHTML = '<p aria-busy="true">Loading…</p>';
                try {
                    const resp = await fetch(`/api/studies/${n}`);
                    if (!resp.ok) throw new Error('failed to load study');
                    const data = await resp.json();
                    renderDetail(n, data);
                } catch (err) {
                    console.error(err);
                    el.innerHTML = '<p>Could not load study detail.</p>';
                }
            }

            function isManual(exam, path) {
                const manual = exam && exam.manual && exam.manual.fields ? exam.manual.fields : {};
                return Object.prototype.hasOwnProperty.call(manual, path);
            }

            function get(obj, path) {
                return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
            }

            function renderDetail(n, payload) {
                const el = document.getElementById('detail-panel-container');
                const study = payload.study || {};
                const exam = payload.exam;

                if (!exam) {
                    el.innerHTML = `<p>No exam data extracted for this study yet.</p>` + actionsHtml(n, study);
                    wireActions(n, study);
                    return;
                }

                const regionOptions = REGION_INDICATION_OPTIONS.map((o, i) => {
                    const selected = (exam.indication && exam.indication.region === o.region &&
                        exam.indication.clinical_indication === o.indication) ? 'selected' : '';
                    return `<option value="${i}" ${selected}>${esc(o.region)} / ${esc(o.indication)}</option>`;
                }).join('');

                const contrastOptions = ["Non-contrast", "Contrast-enhanced"].map(c => {
                    const selected = exam.indication && exam.indication.iv_contrast === c ? 'selected' : '';
                    return `<option value="${c}" ${selected}>${c}</option>`;
                }).join('');

                const qualityOptions = ['<option value="">—</option>'].concat(
                    IMAGE_QUALITY_OPTIONS.map(q => {
                        const selected = exam.image_quality === q ? 'selected' : '';
                        return `<option value="${q}" ${selected}>${q}</option>`;
                    })
                ).join('');

                // RHYTHM protocol dropdown: local keys from
                // config/rhythm_protocols.yaml (capabilities.rhythm_protocols).
                // Its UUID becomes the manifest item's protocol_id; RHYTHM
                // derives region/indication/contrast/type/group/scanner from
                // the registered protocol.
                const currentProtoKey = get(exam, 'rhythm.protocol_key') || '';
                const retainVal = get(exam, 'rhythm.retain_after_project');
                const retainOptions = [
                    ['', 'Default (kept)'], ['true', 'Yes — consent given'], ['false', 'No — delete at project end'],
                ].map(([v, l]) => {
                    const cur = retainVal === true ? 'true' : retainVal === false ? 'false' : '';
                    return `<option value="${v}" ${cur === v ? 'selected' : ''}>${l}</option>`;
                }).join('');
                const rhythmProtocolOptions = ['<option value="">—</option>'].concat(
                    (CAPABILITIES.rhythm_protocols || []).map(p => {
                        const selected = currentProtoKey === p.id ? 'selected' : '';
                        const label = esc((p.name || p.id) + (p.uuid_pending ? ' (UUID pending)' : ''));
                        return `<option value="${esc(p.id)}" ${selected}>${label}</option>`;
                    })
                ).join('');

                // exam.series lists DICOM series (reconstructions) — NOT the
                // same thing as an irradiation event. One RDSR acquisition
                // (one real dose event) can be reconstructed into several
                // series at different kernel/thickness, so several rows
                // here can share one event; rdsr.acquisitions[] below is the
                // authoritative per-irradiation-event record.
                const seriesList = exam.series || [];

                // One editable input for a series.<N>.<leaf> path. type
                // defaults to a number input; pass {type: 'text'} for
                // string fields (convolution_kernel, patient_position).
                const seriesField = (seriesNumber, leaf, label, value, opts) => {
                    opts = opts || {};
                    const path = `series.${seriesNumber}.${leaf}`;
                    const cls = isManual(exam, path) ? 'manual-set' : '';
                    const type = opts.type || 'number';
                    const step = type === 'number' ? ' step="any"' : '';
                    const val = value != null ? esc(value) : '';
                    return `<label>${esc(label)}
                        <input type="${type}"${step} data-path="${path}" class="${cls}" value="${val}">
                    </label>`;
                };

                // Series with no SeriesNumber (key "?" in the extractor) have
                // no stable dotted path to overlay a manual value onto — keep
                // them in the read-only table only. One <fieldset> per series.
                const editableSeries = seriesList.filter(s => s.series_number != null);
                const seriesFields = editableSeries.map(s => {
                    const n2 = s.series_number;
                    const topoBadge = s.is_topogram ? ' <span class="badge badge-muted">topogram</span>' : '';
                    return `
                        <fieldset>
                            <legend>Series ${esc(n2)} — ${esc(s.series_description || '')}${topoBadge}</legend>
                            <div class="grid">
                                ${seriesField(n2, 'dlp_mgy_cm', 'DLP (mGy·cm)', s.dlp_mgy_cm)}
                                ${seriesField(n2, 'ctdi_vol_mgy', 'CTDIvol (mGy)', s.ctdi_vol_mgy)}
                                ${seriesField(n2, 'slice_thickness_mm', 'Slice thickness (mm)', s.slice_thickness_mm)}
                                ${seriesField(n2, 'exposure_time_ms', 'Exposure time (ms)', s.exposure_time_ms)}
                                ${seriesField(n2, 'spiral_pitch_factor', 'Pitch factor', s.spiral_pitch_factor)}
                            </div>
                            <div class="grid">
                                ${seriesField(n2, 'convolution_kernel', 'Convolution kernel', s.convolution_kernel, {type: 'text'})}
                                ${seriesField(n2, 'patient_position', 'Patient position', s.patient_position, {type: 'text'})}
                                ${seriesField(n2, 'single_collimation_width_mm', 'Single collimation (mm)', s.single_collimation_width_mm)}
                                ${seriesField(n2, 'total_collimation_width_mm', 'Total collimation (mm)', s.total_collimation_width_mm)}
                            </div>
                        </fieldset>`;
                }).join('');
                const seriesBlock = seriesFields ? `
                        <details>
                            <summary>Per-series technique parameters (${editableSeries.length})</summary>
                            ${seriesFields}
                        </details>` : '';

                const num = v => v != null ? v.toFixed(2) : '—';
                const seriesTable = seriesList.length ? `
                    <figure><table><thead><tr>
                        <th scope="col">Series</th><th scope="col">Description</th><th scope="col">Type</th>
                        <th scope="col">CTDIvol (mGy)</th><th scope="col">DLP (mGy·cm)</th>
                        <th scope="col">Slice (mm)</th><th scope="col">Exposure (ms)</th><th scope="col">Kernel</th>
                        <th scope="col">Position</th><th scope="col">Coll. single/total (mm)</th><th scope="col">Pitch</th>
                    </tr></thead>
                    <tbody>${seriesList.map(s => `<tr><th scope="row">${esc(s.series_number)}</th><td>${esc(s.series_description)}</td>` +
                        `<td>${s.is_topogram ? 'Topogram' : 'Series'}</td>` +
                        `<td>${num(s.ctdi_vol_mgy)}</td>` +
                        `<td>${num(s.dlp_mgy_cm)}</td>` +
                        `<td>${num(s.slice_thickness_mm)}</td>` +
                        `<td>${s.exposure_time_ms != null ? s.exposure_time_ms : '—'}</td>` +
                        `<td>${esc(s.convolution_kernel) || '—'}</td>` +
                        `<td>${esc(s.patient_position) || '—'}</td>` +
                        `<td>${num(s.single_collimation_width_mm)} / ${num(s.total_collimation_width_mm)}</td>` +
                        `<td>${num(s.spiral_pitch_factor)}</td></tr>`).join('')}</tbody></table></figure>`
                    : '<p><small>No series recorded.</small></p>';

                const rdsr = exam.rdsr;
                const rdsrTable = rdsr && rdsr.acquisitions && rdsr.acquisitions.length ? `
                    <p><small>Total DLP: ${rdsr.total_dlp_mgy_cm != null ? rdsr.total_dlp_mgy_cm.toFixed(2) + ' mGy·cm' : '—'}</small></p>
                    <figure><table><thead><tr><th scope="col">Protocol</th><th scope="col">Type</th><th scope="col">kVp</th>
                        <th scope="col">mean mA</th><th scope="col">Mean CTDIvol</th><th scope="col">DLP</th></tr></thead>
                    <tbody>${rdsr.acquisitions.map(a => `<tr><th scope="row">${esc(a.acquisition_protocol)}</th><td>${esc(a.acquisition_type)}</td>` +
                        `<td>${esc(a.kvp)}</td><td>${esc(a.mean_ma)}</td>` +
                        `<td>${a.mean_ctdivol_mgy != null ? a.mean_ctdivol_mgy.toFixed(2) : '—'}</td>` +
                        `<td>${a.dlp_mgy_cm != null ? a.dlp_mgy_cm.toFixed(2) : '—'}</td></tr>`).join('')}</tbody></table></figure>`
                    : '<p><small>No RDSR data for this study.</small></p>';

                const notes = (exam.notes || []).map(n2 => `<li>${esc(n2)}</li>`).join('');

                el.innerHTML = `
                    <article>
                        <header><strong>Manual review</strong> — study ${String(n).padStart(4, '0')}</header>
                        <form id="exam-form-${n}">
                        <fieldset>
                            <legend>Patient &amp; indication</legend>
                            <div class="grid">
                                <label>Weight (kg)
                                    <input type="number" step="any" min="0" required data-path="patient.weight_kg"
                                        class="${isManual(exam, 'patient.weight_kg') ? 'manual-set' : ''}"
                                        value="${get(exam, 'patient.weight_kg') != null ? get(exam, 'patient.weight_kg') : ''}">
                                </label>
                                <label>Age (years)
                                    <input type="number" step="any" min="0" required data-path="patient.age_years"
                                        class="${isManual(exam, 'patient.age_years') ? 'manual-set' : ''}"
                                        value="${get(exam, 'patient.age_years') != null ? get(exam, 'patient.age_years') : ''}">
                                </label>
                                <label>Region / Indication
                                    <select id="region-indication-${n}" required
                                        class="${(isManual(exam, 'indication.region') || isManual(exam, 'indication.clinical_indication')) ? 'manual-set' : ''}">
                                        <option value="">— unset —</option>
                                        ${regionOptions}
                                    </select>
                                </label>
                                <label>IV contrast
                                    <select data-path="indication.iv_contrast" required
                                        class="${isManual(exam, 'indication.iv_contrast') ? 'manual-set' : ''}">
                                        <option value="">—</option>
                                        ${contrastOptions}
                                    </select>
                                </label>
                            </div>
                        </fieldset>
                        <fieldset>
                            <legend>Image quality &amp; protocol</legend>
                            <div class="grid">
                                <label>Image quality
                                    <select data-path="image_quality" required
                                        class="${isManual(exam, 'image_quality') ? 'manual-set' : ''}">
                                        ${qualityOptions}
                                    </select>
                                </label>
                                <label>Protocol name
                                    <input type="text" data-path="protocol_used_hint.protocol_name"
                                        class="${isManual(exam, 'protocol_used_hint.protocol_name') ? 'manual-set' : ''}"
                                        value="${esc(get(exam, 'protocol_used_hint.protocol_name') || '')}">
                                    <small>informational only</small>
                                </label>
                                <label>RHYTHM protocol
                                    <select data-path="rhythm.protocol_key" required
                                        class="${isManual(exam, 'rhythm.protocol_key') ? 'manual-set' : ''}">
                                        ${rhythmProtocolOptions}
                                    </select>
                                    <small>its UUID goes in the manifest;
                                        region/indication/contrast/scanner are derived from it
                                        upstream</small>
                                </label>
                                <label>Keep after project end
                                    <select data-path="rhythm.retain_after_project" data-type="bool"
                                        class="${isManual(exam, 'rhythm.retain_after_project') ? 'manual-set' : ''}">
                                        ${retainOptions}
                                    </select>
                                    <small>patient's retention consent; default is kept</small>
                                </label>
                            </div>
                        </fieldset>
                        ${seriesBlock}
                        <label>Operator notes
                            <textarea data-path="operator_notes"
                                class="${isManual(exam, 'operator_notes') ? 'manual-set' : ''}"
                            >${esc(get(exam, 'operator_notes') || '')}</textarea>
                        </label>
                        <div class="action-row">
                            <button type="submit">Save</button>
                            <small id="save-status-${n}"></small>
                        </div>
                        </form>
                    </article>

                    <article>
                        <header><strong>Derived</strong> — ${esc(exam.protocol_type) || '—'} / ${esc(exam.examination_group) || '—'}</header>
                        <blockquote>Prefer <code>rdsr.acquisitions[*].mean_ctdivol_mgy</code> over
                            <code>series[*].ctdi_vol_mgy</code> — the flat per-image CTDIvol tag is cumulative
                            dose-to-date on this scanner, not per-acquisition.</blockquote>
                        <details open>
                            <summary>Irradiation events (RDSR acquisitions, read-only)</summary>
                            <p><small>The authoritative per-dose-event record. One event can be
                                reconstructed into several DICOM series below (e.g. two kernels from one
                                spiral pass) — series counts and event counts don't need to match.</small></p>
                            ${rdsrTable}
                        </details>
                        <details>
                            <summary>DICOM series (reconstructions, read-only)</summary>
                            ${seriesTable}
                        </details>
                        <details>
                            <summary>Notes (${(exam.notes || []).length})</summary>
                            <ul>${notes || '<li>None.</li>'}</ul>
                        </details>
                    </article>

                    ${actionsHtml(n, study, exam)}
                `;

                const riSelect = document.getElementById(`region-indication-${n}`);
                if (riSelect) {
                    riSelect.dataset.initial = riSelect.value;
                    riSelect.addEventListener('change', () => {
                        const idx = riSelect.value;
                        if (idx === '') return;
                        const opt = REGION_INDICATION_OPTIONS[parseInt(idx, 10)];
                        const contrastSelect = el.querySelector('select[data-path="indication.iv_contrast"]');
                        if (contrastSelect && !contrastSelect.value) {
                            contrastSelect.value = opt.contrast;
                        }
                    });
                }

                // Snapshot each field's rendered value so Save can tell an
                // untouched field (skip) from one the operator actually
                // changed (send) — sending every non-empty field would pin
                // extracted values into the manual overlay forever.
                el.querySelectorAll('[data-path]').forEach(input => {
                    input.dataset.initial = input.value;
                });

                // Native form validation gates the submit — the browser blocks
                // it and points at the first empty required field.
                const examForm = document.getElementById(`exam-form-${n}`);
                if (examForm) examForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    saveExam(n);
                });

                wireActions(n, study);
            }

            function actionsHtml(n, study, exam) {
                const location = study.location || 'absent';
                const absent = location === 'absent';
                const dicomDisabled = absent || !CAPABILITIES.dicom;
                const httpDisabled = absent || !CAPABILITIES.http;
                const dicomTitle = absent ? 'study directory not found' :
                    (!CAPABILITIES.dicom ? 'DICOM export is not configured' : '');
                const httpTitle = absent ? 'study directory not found' :
                    (!CAPABILITIES.http ? 'HTTP export is not configured' : '');
                const reextractTitle = absent ? 'study directory not found' : '';

                // RHYTHM is gated on config + the rhythm profile + defacing
                // having completed + image quality being filled in (the
                // manifest requires it). The reason goes in the button title.
                let rhythmTitle = '';
                if (!CAPABILITIES.rhythm) rhythmTitle = 'RHYTHM export is not configured';
                else if (CAPABILITIES.anonymization_profile !== 'rhythm')
                    rhythmTitle = "RHYTHM export requires the 'rhythm' anonymization profile";
                else if (absent) rhythmTitle = 'study directory not found';
                else if (study.status === 'defacing_failed')
                    rhythmTitle = 'defacing did not complete for this study';
                else if (!exam || !exam.image_quality)
                    rhythmTitle = 'set Image quality before uploading to RHYTHM';
                else if (!exam.rhythm || !exam.rhythm.protocol_key)
                    rhythmTitle = 'select a RHYTHM protocol before uploading';
                const rhythmDisabled = !!rhythmTitle;
                const rhythmLabel = study.rhythm_status && study.rhythm_status !== 'failed'
                    ? 'Re-upload to RHYTHM' : 'Upload to RHYTHM';
                const rhythmLine = study.rhythm_status
                    ? `<small>RHYTHM job: ${esc(study.rhythm_status)}` +
                      `${study.rhythm_batch ? ' (batch ' + esc(study.rhythm_batch) + ')' : ''}</small>`
                    : '';
                const manifestLinks = exam
                    ? `<small>RHYTHM manifest: ` +
                      `<a href="/api/studies/${n}/rhythm-manifest" target="_blank" rel="noopener">preview</a> · ` +
                      `<a href="/api/studies/${n}/rhythm-manifest?download=1">download</a></small>`
                    : '';

                return `
                    <article>
                        <header><strong>Actions</strong></header>
                        <div role="group">
                            <button type="button" id="btn-dicom-${n}" ${dicomDisabled ? 'disabled' : ''} title="${dicomTitle}">Send to DICOM</button>
                            <button type="button" id="btn-reextract-${n}" ${absent ? 'disabled' : ''} title="${reextractTitle}" class="secondary">Re-extract</button>
                            <button type="button" id="btn-http-${n}" ${httpDisabled ? 'disabled' : ''} title="${httpTitle}" class="secondary">Upload to HTTP storage</button>
                            <button type="button" id="btn-rhythm-${n}" ${rhythmDisabled ? 'disabled' : ''} title="${rhythmTitle}" class="secondary">${rhythmLabel}</button>
                        </div>
                        <footer>
                            <small id="action-status-${n}"></small>
                            ${rhythmLine}
                            ${manifestLinks}
                        </footer>
                    </article>
                `;
            }

            function wireActions(n, study) {
                const dicomBtn = document.getElementById(`btn-dicom-${n}`);
                const reBtn = document.getElementById(`btn-reextract-${n}`);
                const httpBtn = document.getElementById(`btn-http-${n}`);
                const rhythmBtn = document.getElementById(`btn-rhythm-${n}`);
                if (dicomBtn) dicomBtn.addEventListener('click', () => runAction(n, 'send_dicom'));
                if (reBtn) reBtn.addEventListener('click', () => runAction(n, 'reextract'));
                if (httpBtn) httpBtn.addEventListener('click', () => runAction(n, 'upload_http'));
                if (rhythmBtn) rhythmBtn.addEventListener('click', () => runAction(n, 'upload_rhythm'));
            }

            async function runAction(n, action) {
                const status = document.getElementById(`action-status-${n}`);
                if (status) status.textContent = 'Working…';
                let message = '';
                try {
                    const resp = await fetch(`/api/studies/${n}/actions/${action}`, {
                        method: 'POST',
                        headers: authHeaders({ 'Content-Type': 'application/json' }),
                    });
                    const data = await resp.json();
                    message = data.message || (data.ok ? 'Done.' : 'Failed.');
                } catch (err) {
                    console.error(err);
                    message = 'Request failed.';
                }

                // Reload the list (counters/location may have changed) and
                // the detail panel (re-extract refreshes the exam data) —
                // loadStudies() rebuilds the whole table, which would wipe
                // out anything loadDetail wrote if called first, so the
                // status message is applied to the freshly-rendered panel
                // last, not before these reloads run.
                await loadStudies();
                if (EXPANDED === n) {
                    await loadDetail(n);
                    const newStatus = document.getElementById(`action-status-${n}`);
                    if (newStatus) newStatus.textContent = message;
                }
            }

            async function saveExam(n) {
                const el = document.getElementById('detail-panel-container');
                const status = document.getElementById(`save-status-${n}`);
                const fields = {};

                // Only send fields the operator actually changed from what was
                // rendered — sending every filled-in field would re-pin values
                // ExamExtractor already derived correctly into the manual
                // overlay, and they'd never update again on re-extract.
                el.querySelectorAll('[data-path]').forEach(input => {
                    const path = input.dataset.path;
                    const val = input.value;
                    if (val === (input.dataset.initial || '')) return;
                    if (val === '') return;
                    if (input.type === 'number') {
                        const num = parseFloat(val);
                        if (!Number.isNaN(num)) fields[path] = num;
                    } else if (input.dataset.type === 'bool') {
                        fields[path] = val === 'true';
                    } else {
                        fields[path] = val;
                    }
                });

                const riSelect = document.getElementById(`region-indication-${n}`);
                if (riSelect && riSelect.value !== '' && riSelect.value !== (riSelect.dataset.initial || '')) {
                    const opt = REGION_INDICATION_OPTIONS[parseInt(riSelect.value, 10)];
                    fields['indication.region'] = opt.region;
                    fields['indication.clinical_indication'] = opt.indication;
                }

                if (status) status.textContent = 'Saving…';
                try {
                    const resp = await fetch(`/api/studies/${n}/exam`, {
                        method: 'PUT',
                        headers: authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ fields }),
                    });
                    const data = await resp.json();
                    if (!resp.ok) {
                        if (status) status.textContent = data.message || data.error || 'Save failed.';
                        return;
                    }
                    // Reload first, then set the message on the freshly-rendered
                    // panel's status element — loadDetail() rebuilds the whole
                    // panel (same reasoning as runAction()), so setting it
                    // before would just get wiped out.
                    await loadStudies();
                    await loadDetail(n);
                    const newStatus = document.getElementById(`save-status-${n}`);
                    if (newStatus) newStatus.textContent = data.message || 'Saved.';
                } catch (err) {
                    console.error(err);
                    if (status) status.textContent = 'Save failed.';
                }
            }

            async function refreshStudies() {
                await loadStudies();
                if (EXPANDED != null) await loadDetail(EXPANDED);
            }

            document.addEventListener('DOMContentLoaded', loadStudies);
        </script>
    </body>
</html>

# PixieVeil Configuration

# DICOM Server Settings
dicom_server:
  ae_title: "PIXIEVEIL"
  port: 4070
  ip: "0.0.0.0"

# Storage Settings
storage:
  base_path: "./data/dicom"
  temp_path: "./data/tmp"
  max_storage_gb: 100
  # Optional: keep each already-anonymized study on disk for N days after a
  # successful export instead of deleting it immediately — useful for
  # auditing or harvesting real acquisition parameters. The retention clock
  # starts at export success (for RHYTHM, when the ingest job reaches
  # COMPLETE). After the window the study directory, its export ZIP/manifest
  # and its deface scratch are removed, but the <NNNN>.state.json /
  # <NNNN>.exam.json records are kept permanently. Omit or set 0/null to
  # keep the default (delete right after export). A study uploaded to RHYTHM
  # but never confirmed COMPLETE keeps its export ZIP indefinitely as the
  # retry source.
  #retain_after_export_days: 14
  # HTTP/RHYTHM exports write <NNNN>.zip + <NNNN>.json here before sending;
  # DICOM C-STORE exports produce no artifact. Defaults to an "export" dir
  # next to base_path. Retained studies still count toward max_storage_gb.
  #export_path: "./data/export"

  # Optional remote storage — remove entire block to keep archives local.
  # Every export is manual (a Send/Upload click on the /studies dashboard);
  # nothing is sent automatically. A study can be sent to more than one of
  # these; the first successful export does the retain-or-delete bookkeeping.
  # Must nest under storage: (this indentation) — code reads it from
  # settings.storage["remote_storage"], not from a top-level key.
  #remote_storage:
  #  # HTTP ZIP upload
  #  http:
  #    base_url: "https://your-storage-server"
  #    auth_token: "your-bearer-token"
  #  # DICOM C-STORE (send individual .dcm files to a DICOM node / PACS)
  #  dicom:
  #    host: "127.0.0.1"
  #    port: 4070
  #    ae_title: "ORTHANC"          # called AE title (remote node)
  #    calling_ae: "PIXIEVEIL_SCU"  # our AE title (defaults to dicom_server.ae_title)
  #  # RHYTHM CT upload platform (v2 server-assigned batch API). Uploads a
  #  # per-study ZIP over the resumable chunked-upload endpoints; RHYTHM
  #  # re-validates GDPR anonymization, assigns the Repository Study ID
  #  # asynchronously, and pushes to its Orthanc. Requires anonymization
  #  # profile "gdpr" (research keeps study dates / non-regenerated UIDs
  #  # that RHYTHM rejects) and a per-study image_quality set on the
  #  # /studies page before a study can be sent.
  #  rhythm:
  #    base_url: "https://rhythm.your-domain"
  #    auth_token: "rhythm-upload-token"   # `manage.py create_upload_token`, NOT a login
  #    site_code: "S014"                   # assigned by RHYTHM per institution — read
  #                                        # it off your RHYTHM profile, from the admin,
  #                                        # or the S### segment of a Repository Study ID
  #    #protocol_map: "config/rhythm_protocols.yaml"   # local protocol key -> registered
  #                                        # CTProtocol UUID (this is the default path);
  #                                        # see config/rhythm_protocols.example.yaml. Each
  #                                        # study picks one on /studies; its UUID becomes
  #                                        # the manifest item's protocol_id, from which
  #                                        # RHYTHM derives region/indication/contrast/
  #                                        # protocol type/exam group/scanner.
  #    #chunk_size: 10485760               # bytes per chunk (default 10 MiB)
  #    #max_chunk_retries: 3

# HTTP Server Settings
http_server:
  port: 8070
  ip: "0.0.0.0"
  # Dashboard login. Every page and API route except /login and /health
  # needs a signed-in user (browser session cookie) or a per-user API token
  # ("Authorization: Bearer pv_..."). There is no self-registration — manage
  # users with `python -m pixieveil.auth` (or `./pixieveil.sh users ...`);
  # admins can also do it on the dashboard's /users page, or add
  # `password: "plaintext"` for a user in users.yaml by hand — it is hashed
  # (and the plaintext removed from the file) on next access.
  #users_file: "config/users.yaml"            # hashed passwords, chmod 600
  #session_secret_file: "config/.session_secret"  # created on first start
  #session_idle_hours: 12      # log out after this long without activity
  #session_max_days: 7         # ...and after this long regardless
  # Set true when the dashboard is served over HTTPS (e.g. behind a reverse
  # proxy) so the session cookie is never sent over plain HTTP.
  #secure_cookies: false

# Study Management
study:
  completion_timeout: 120         # seconds of inactivity before a study is considered done
  completion_check_interval: 30   # how often (seconds) to check for completed studies
  max_study_size_mb: 4000

# Series Filtering
# Attribute-based rules use DICOM keyword names mapped to regular expressions.
# Include takes priority over exclude:
#   - If any include rule matches -> keep the series
#   - Else if any exclude rule matches -> filter the series out
#   - Else -> keep the series
# For multi-value attributes (e.g. ImageType) each value is tested individually.
series_filter:
  exclude_modalities: ["PR", "RT"]
  only_original_series: true
#  include:
#    SeriesDescription: "(?i)topogram"
#  exclude:
#    SeriesDescription: "(?i)dose\\s+report"
#    ImageType: "^DERIVED"

# Defacing
# Runs after anonymization on series identified as head scans.
defacing:
  enabled: false
  device: "cuda"             # "cuda" (GPU), "mps" (Apple Silicon), or "cpu"; falls back to cpu automatically
  keep_backup: true          # keep anonymized-but-not-defaced series as <series>_pre_deface/; set false in production
  rotation_mode: "iop"       # "none" to skip; anything else applies IOP-based transpose (recommended)
  mask_dilation_mm: 2.0      # grow the face mask by this many mm before applying; eliminates skin-edge residue
  model_dir: ./data/nnUNet
  body_parts:                # BodyPartExamined values that indicate a head scan (case-insensitive)
    - HEAD
    - BRAIN
    - NECK
    - SKULL
  series_description_pattern: "(?i)(head|brain|skull|cranial|cerebr)"

# Logging
logging:
  level: "INFO"
  file: "./data/log/pixieveil.log"
  anontrail: "./data/log/anontrail.jsonl"

anonymization:
  profile: "research"
  profiles:
    research:
      # Research profile: pseudonymized data with preserved study dates
      PatientName: PSEUDO
      PatientID: PSEUDO
      PatientBirthDate: CLEAR
      PatientAge: KEEP
      PatientSex: KEEP
      InstitutionName: DEID_CENTER
      StudyID: RESEARCH
      StudyInstanceUID: PSEUDOUID
      StudyDescription: KEEP
      SeriesInstanceUID: PSEUDOUID
      SeriesDescription: KEEP
      FrameOfReferenceUID: PSEUDOUID
      ReferringPhysicianName: CLEAR
      OperatorsName: CLEAR
      PerformingPhysicianName: CLEAR
      AccessionNumber: CLEAR
      KeepPrivateTags: false
      PixelBlackout: false
      RetainStudyDate: true
    gdpr:
      # GDPR profile: fully anonymized with strong data protection
      PatientName: ANON
      PatientID: PSEUDO
      PatientBirthDate: CLEAR
      PatientAge: CLEAR
      PatientSex: CLEAR
      InstitutionName: CLEAR
      StudyID: STUDY
      StudyInstanceUID: NEWUID
      StudyDescription: CLEAR
      SeriesInstanceUID: NEWUID
      SeriesDescription: CLEAR
      FrameOfReferenceUID: NEWUID
      ReferringPhysicianName: CLEAR
      OperatorsName: CLEAR
      PerformingPhysicianName: CLEAR
      AccessionNumber: CLEAR
      KeepPrivateTags: false
      PixelBlackout: false
      RetainStudyDate: false
    rhythm:
      # RHYTHM CT upload platform: passes RHYTHM's own GDPR-strict ingest
      # validator (reference/uploader/ct_upload_platform/GDPR-strict.json).
      # Every tag that validator marks "must be removed" is either emptied by
      # a strategy below or deleted outright via RemoveTags. PatientName /
      # PatientID are removed, not pseudonymised — RHYTHM keys studies on its
      # own Repository Study ID, not the DICOM PatientID. PatientAge/Size/
      # Weight are kept (GDPR-strict marks them KEEP; the RHYTHM manifest
      # uses age/weight). Select this profile at receive time; anonymization
      # is one-shot, so a study received under another profile can't be
      # re-exported to RHYTHM — re-send the source DICOM.
      # The RemoveTags list is cross-checked against the vendored
      # GDPR-strict.json by tests/test_anonymizer_rhythm.py.
      PatientName: null
      PatientID: PSEUDO           # kept for the anontrail; RemoveTags then
                                  # deletes it from every shipped file
      PatientBirthDate: null
      PatientAge: KEEP
      PatientSex: CLEAR
      InstitutionName: null
      StudyID: null
      StudyInstanceUID: NEWUID
      StudyDescription: null
      SeriesInstanceUID: NEWUID
      SeriesDescription: null
      FrameOfReferenceUID: NEWUID
      ReferringPhysicianName: null
      OperatorsName: null
      PerformingPhysicianName: null
      AccessionNumber: null
      KeepPrivateTags: false
      PixelBlackout: false
      RetainStudyDate: false
      RemoveTags:
        - AcquisitionComments
        - AcquisitionDate
        - AcquisitionDateTime
        - AcquisitionTime
        - Allergies
        - ConsultingPhysicianName
        - ContentDate
        - ContentTime
        - CurveDate
        - CurveTime
        - DeviceSerialNumber
        - DeviceUID
        - DoseReferenceUID
        - EthnicGroup
        - FrameComments
        - ImageComments
        - Impressions
        - InstanceCoercionDateTime
        - InstanceCreatorUID
        - InstitutionAddress
        - InstitutionCodeSequence
        - InstitutionalDepartmentName
        - IssuerOfPatientID
        - Manufacturer
        - ManufacturerModelName
        - NameOfPhysiciansReadingStudy
        - Occupation
        - OperatorIdentificationSequence
        - OtherPatientIDs
        - OtherPatientNames
        - OverlayDate
        - OverlayTime
        - PatientAddress
        - PatientBirthTime
        - PatientID
        - PatientName
        - PatientTelecomInformation
        - PatientTelephoneNumbers
        - PerformingPhysicianIdentificationSequence
        - ProtocolName
        - ROIName
        - ReferencedSeriesSequence
        - ReferencedStudySequence
        - ReferringPhysicianAddress
        - ReferringPhysicianTelephoneNumbers
        - SeriesDate
        - SeriesTime
        - StationName
        - StudyDate
        - StudyTime
        - TimezoneOffsetFromUTC
        - UID

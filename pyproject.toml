[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixieveil"
version = "0.1.0"
description = "DICOM anonymization server"
authors = [
    {name = "Costin Stroie", email = "costinstroie@eridu.eu.org"}
]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pynetdicom>=3.0.4",
    "pydicom>=3.0.2",       # save_as(enforce_file_format=...) is 3.x-only
    "aiohttp>=3.14.4",      # GHSA-2g87-pp6c-29x5 et al. (dashboard server DoS)
    "multidict>=6.9.1",    # GHSA-54p9-h82j-f925 (aiohttp dependency)
    "pydantic>=2.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
deface = [
    "simpleitk>=2.0.0",
    "nibabel>=4.0.0",
    "numpy>=1.21.0",
    "gdown>=5.0.0",
    # Model weights are fetched over HTTPS and then torch.load()ed: keep the
    # CA bundle and HTTP stack patched (GHSA-6q48-6c7w-9gw2, GHSA-8988-9cw3-xx77).
    "certifi>=2026.10.18",
    "urllib3>=2.8.0",
    "nnunetv2"
]
test = [
    "pytest>=8.0.0",
    # Used only by test_rhythm_manifest_schema.py to validate our built
    # manifest items against RHYTHM's own vendored JSON Schema
    # (reference/uploader). Same library RHYTHM's server uses.
    "jsonschema>=4.0.0"
]
lint = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "types-PyYAML"
]

[project.scripts]
pixieveil = "pixieveil.cli:run"
pixieveil-install = "install:main"

[project.urls]
Homepage = "https://github.com/cstroie/PixieVeil"
Repository = "https://github.com/cstroie/PixieVeil.git"

[tool.setuptools.packages.find]
include = ["pixieveil*"]

# The dashboard serves these from disk next to its module — ship them in
# non-editable installs too.
[tool.setuptools.package-data]
"pixieveil.dashboard" = ["templates/*.html", "static/*", "rhythm_choices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

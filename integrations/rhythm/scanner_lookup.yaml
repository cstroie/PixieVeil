# Maps DICOM (Manufacturer, ManufacturerModelName) to the scanner_id RHYTHM
# assigned when the scanner was registered. Loaded by
# pixieveil.processing.exam_extractor.
#
# Key format: "<Manufacturer>|<ManufacturerModelName>" exactly as they
# appear in the DICOM header (case-sensitive) -> RHYTHM scanner UUID.
#
# The earlier RHYTHM protocol-GUI sample data listed our scanner as
# "Siemens Healthineers – Siemens SOMATOM Perspective", but real headers
# pulled from our own studies (confirmed on study 0049, 2026-08-18) report
# Manufacturer=SIEMENS, ManufacturerModelName="Emotion 16" instead.
#
# The entry below uses the one scanner UUID present in that sample data,
# on the reasoning that RHYTHM only had a single scanner registered at the
# time — so the ID is very likely ours even though its displayed model
# name doesn't match the real header. NOT independently confirmed against
# RHYTHM's own scanner dropdown/API. Verify there, then either keep this
# entry or correct the UUID.
"SIEMENS|Emotion 16": "7076d1dc-100a-4bcd-a8d7-2ef3672b1e3f"
